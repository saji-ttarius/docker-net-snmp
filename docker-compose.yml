services:
  snmp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: net-snmp-trixie:latest
    container_name: snmp-trixie
    restart: unless-stopped
    ports:
      - "1610:161/udp"
      - "705:705/tcp"
    volumes:
      - snmp-logs:/var/log/snmp
    environment:
      - SNMP_COMMUNITY=public
      - SNMP_LOCATION=Docker Container (Debian Trixie arm64)
      - SNMP_CONTACT=admin@example.com
    networks:
      - snmp-network
    healthcheck:
      # OID で直接指定（MIB 名はコンテナ内に存在しないため）
      test: [ "CMD", "snmpwalk", "-v2c", "-c", "public", "127.0.0.1", ".1.3.6.1.2.1.1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  snmp-logs:
    driver: local

networks:
  snmp-network:
    driver: bridge
